function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

const evaluatedQuestions = new Set();

function renderQuiz() {
    const wrapper = document.getElementById('quiz-wrapper');
    wrapper.innerHTML = ""; 
    
    // Shuffle the full test layout
    const randomizedQuestions = shuffleArray(quizData);

    randomizedQuestions.forEach((q) => {
        const masterIndex = quizData.findIndex(item => item.id === q.id);

        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `qcard-${masterIndex}`;

        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.innerText = q.question;
        card.appendChild(qText);

        if (q.type === 'choice') {
            const optionsContainer = document.createElement('div');
            optionsContainer.className = 'options-container';
            
            // Loop through options sequentially in their fixed sequence
            q.options.forEach(opt => {
                const label = document.createElement('label');
                label.className = 'option-label';
                
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = `q-${masterIndex}`;
                radio.value = opt;
                
                label.appendChild(radio);
                label.appendChild(document.createTextNode(opt));
                optionsContainer.appendChild(label);
            });
            card.appendChild(optionsContainer);
            
        } else if (q.type === 'text') {
            const inputContainer = document.createElement('div');
            inputContainer.className = 'text-input-container';
            
            const textInput = document.createElement('input');
            textInput.type = 'text';
            textInput.className = 'text-answer-field';
            textInput.id = `input-${masterIndex}`;
            textInput.placeholder = "Type your answer here...";
            
            inputContainer.appendChild(textInput);
            card.appendChild(inputContainer);
            
        } else if (q.type === 'dropdown') {
            const dropdownContainer = document.createElement('div');
            dropdownContainer.className = 'dropdown-matching-container';
            
            q.matches.forEach((matchItem, matchIdx) => {
                const row = document.createElement('div');
                row.className = 'dropdown-row';
                
                const label = document.createElement('div');
                label.className = 'dropdown-label';
                label.innerText = `${matchItem.term} — `;
                
                const select = document.createElement('select');
                select.className = 'quiz-select';
                select.id = `select-${masterIndex}-${matchIdx}`;
                
                const defaultOpt = document.createElement('option');
                defaultOpt.value = "";
                defaultOpt.innerText = "-- Choose Match --";
                select.appendChild(defaultOpt);
                
                q.dropdownOptions.forEach(optVal => {
                    const option = document.createElement('option');
                    option.value = optVal;
                    option.innerText = optVal;
                    select.appendChild(option);
                });
                
                row.appendChild(label);
                row.appendChild(select);
                dropdownContainer.appendChild(row);
            });
            card.appendChild(dropdownContainer);
        }

        const checkBtn = document.createElement('button');
        checkBtn.className = 'check-btn';
        checkBtn.innerText = 'Check Answer';
        checkBtn.onclick = () => verifyAnswer(masterIndex, q);
        card.appendChild(checkBtn);

        const feedback = document.createElement('div');
        feedback.className = 'feedback';
        feedback.id = `feedback-${masterIndex}`;
        card.appendChild(feedback);

        wrapper.appendChild(card);
    });
}

function verifyAnswer(index, questionObj) {
    const feedback = document.getElementById(`feedback-${index}`);
    let isCorrect = false;
    let feedbackText = "";

    if (questionObj.type === 'choice') {
        const selected = document.querySelector(`input[name="q-${index}"]:checked`);
        if (!selected) {
            alert("Please select an option first!");
            return;
        }
        isCorrect = (selected.value === questionObj.answerText);
        feedbackText = isCorrect ? "Correct! Perfect response." : `Incorrect. Correct Answer: ${questionObj.answerText}`;
        
    } else if (questionObj.type === 'text') {
        const inputField = document.getElementById(`input-${index}`);
        const userAnswer = inputField.value.trim();
        if (userAnswer === "") {
            alert("Please type an answer first!");
            return;
        }
        isCorrect = (userAnswer.replace(/\s+/g, '') === questionObj.answer.trim().replace(/\s+/g, ''));
        feedbackText = isCorrect ? "Correct! Perfect response." : `Incorrect. Correct Answer: ${questionObj.answer}`;
        
    } else if (questionObj.type === 'dropdown') {
        let allAnswered = true;
        let incorrectMatches = [];
        let answersSheet = [];

        questionObj.matches.forEach((matchItem, matchIdx) => {
            const selectEl = document.getElementById(`select-${index}-${matchIdx}`);
            if (selectEl.value === "") {
                allAnswered = false;
            }
            const correctCheck = (selectEl.value === matchItem.correct);
            answersSheet.push(`${matchItem.term} -> ${matchItem.correct}`);
            if (!correctCheck) {
                incorrectMatches.push(matchItem.term);
            }
        });

        if (!allAnswered) {
            alert("Please select an option for all items in this matching question!");
            return;
        }

        isCorrect = (incorrectMatches.length === 0);
        feedbackText = isCorrect ? "Correct! All pairs matched perfectly." : `Incorrect matching definition layout.\nCorrect Configuration:\n• ${answersSheet.join('\n• ')}`;
    }

    feedback.style.display = 'block';
    if (isCorrect) {
        feedback.className = 'feedback correct';
    } else {
        feedback.className = 'feedback incorrect';
    }
    feedback.innerText = feedbackText;

    evaluatedQuestions.add(index);
    document.getElementById('evaluated-count').innerText = evaluatedQuestions.size;
}

window.onload = renderQuiz;
