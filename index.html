<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>PHP Sequential Interactive Reviewer</title>
    <style>
        :root {
            --primary-color: #4A148C;
            --accent-color: #3A0CA3;
            --soft-purple: #E1BEE7;
            --page-bg: #ebe6f7;
            --card-bg: #ffffff;
            --panel-bg: #fbf9ff;
            --text-color: #2f2f38;
            --border-color: rgba(74, 20, 140, 0.14);
            --gray-btn: #555555;
            --gray-btn-hover: #333333;
            --correct-bg: #d4edda;
            --correct-text: #155724;
            --incorrect-bg: #f8d7da;
            --incorrect-text: #721c24;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--page-bg);
            color: var(--text-color);
            margin: 0;
            padding: 30px 18px;
            line-height: 1.5;
        }

        .container {
            width: min(1100px, 96%);
            margin: 0 auto;
            background: var(--card-bg);
            padding: 34px 32px;
            border-radius: 18px;
            box-shadow: 0 18px 45px rgba(70, 55, 95, 0.14);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            border-bottom: 2px solid rgba(123, 31, 162, 0.18);
            padding-bottom: 18px;
            margin: 0 0 24px;
            font-size: clamp(1.45rem, 3vw, 2.2rem);
            text-transform: uppercase;
            letter-spacing: 0.23em;
            font-weight: 800;
        }

        .quiz-navigation-top {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 22px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px 20px;
        }

        .quiz-navigation-top label {
            font-weight: 800;
            font-size: 1rem;
            white-space: nowrap;
        }

        .nav-select {
            width: 100%;
            height: 54px;
            padding: 0 14px;
            font-size: 1rem;
            border-radius: 7px;
          border: 1px solid var(--border-color);
          background-color: var(--card-bg);
          color: var(--text-color);
            outline: none;
        }

        /* Ensure options inside the select inherit dark/light colors */
        .nav-select option {
          background-color: var(--card-bg);
          color: var(--text-color);
        }

        .question-card {
          background: var(--card-bg);
          border: 1px solid var(--border-color);
          border-radius: 14px;
          padding: 24px;
          margin-bottom: 22px;
          box-shadow: 0 8px 22px rgba(74, 20, 140, 0.06);
        }



        .quiz-meta {
            color: var(--primary-color);
            font-size: 0.88rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-bottom: 12px;
            opacity: 0.85;
        }

        .question-text {
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 18px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-label {
          display: flex;
          align-items: center;
          min-height: 50px;
          padding: 12px 14px;
          background: var(--card-bg);
          border: 1px solid var(--border-color);
          border-radius: 8px;
          cursor: pointer;
          transition: 0.18s ease;
          font-size: 0.98rem;
        }

        .option-label:hover {
          background: var(--panel-bg);
          border-color: var(--border-color);
        }

        .option-label input[type="radio"] {
            margin-right: 12px;
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .text-input-container {
            margin-top: 8px;
        }

        .text-answer-field {
          width: 100%;
          height: 52px;
          padding: 12px 14px;
          font-size: 1rem;
          border: 1px solid var(--border-color);
          border-radius: 8px;
          background-color: var(--card-bg);
          outline: none;
          color: var(--text-color);
        }

        .dropdown-matching-container {
          margin-top: 12px;
          display: flex;
          flex-direction: column;
          gap: 12px;
          background: var(--panel-bg);
          padding: 14px;
          border-radius: 10px;
          border: 1px solid var(--border-color);
        }

        .dropdown-row {
            display: grid;
            grid-template-columns: minmax(140px, 1fr) minmax(220px, 2fr);
            align-items: center;
            gap: 12px;
        }

        .dropdown-label {
            font-weight: 800;
            font-size: 0.98rem;
            word-break: break-word;
        }

        .quiz-select {
          width: 100%;
          min-height: 46px;
          padding: 10px 12px;
          font-size: 0.96rem;
          border: 1px solid var(--border-color);
          border-radius: 8px;
          background-color: var(--card-bg);
          color: var(--text-color);
        }

        .ordering-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 12px;
        }

        .ordering-item {
          background: var(--card-bg);
          border: 2px solid var(--border-color);
          border-radius: 8px;
          padding: 13px 15px;
          cursor: move;
          user-select: none;
          font-weight: 650;
          transition: 0.18s ease;
          display: flex;
          align-items: center;
          gap: 10px;
        }

        .ordering-item::before {
            content: "⋮⋮";
            color: #888888;
            font-weight: bold;
            flex-shrink: 0;
        }

        .ordering-item:hover,
        .ordering-item.drag-over {
          border-color: var(--primary-color);
          background: var(--panel-bg);
        }

        .ordering-item.dragging {
            opacity: 0.5;
        }

        .action-button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 16px;
        }

        .nav-button-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }

        .quiz-btn {
            width: 100%;
            min-height: 60px;
            color: #ffffff;
            border: none;
            padding: 15px;
            font-size: 1.12rem;
            font-weight: 800;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.18s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .submit-btn {
            background-color: var(--accent-color);
        }

        .submit-btn:hover {
            background-color: #2E0786;
        }

        .finish-btn {
            background-color: #6A1B9A;
        }

        .finish-btn:hover {
            background-color: #4A148C;
        }

        .finish-btn:disabled {
            background-color: #bbbbbb;
            color: #eeeeee;
            cursor: not-allowed;
        }

        .nav-btn {
            background-color: var(--gray-btn);
        }

        .nav-btn:hover {
            background-color: var(--gray-btn-hover);
        }

        .nav-btn:disabled,
        .submit-btn:disabled {
            background-color: #bbbbbb;
            color: #eeeeee;
            cursor: not-allowed;
        }

        .feedback {
            margin-top: 18px;
            padding: 13px 14px;
            border-radius: 8px;
            font-weight: 800;
            display: none;
            white-space: pre-wrap;
            font-size: 0.96rem;
            word-break: break-word;
        }

        .correct {
            background-color: var(--correct-bg);
            color: var(--correct-text);
            border: 1px solid #c3e6cb;
        }

        .incorrect {
            background-color: var(--incorrect-bg);
            color: var(--incorrect-text);
            border: 1px solid #f5c6cb;
        }

        .score-summary {
            text-align: center;
            font-size: 1.18rem;
            font-weight: 800;
            margin-top: 26px;
            padding: 19px 14px;
            background: var(--soft-purple);
            border-radius: 6px;
            color: var(--primary-color);
            box-shadow: 0 4px 14px rgba(74, 20, 140, 0.08);
        }

        .results-panel {
          margin-top: 16px;
          text-align: left;
          background: var(--card-bg);
          border: 1px solid var(--border-color);
          border-radius: 10px;
          padding: 14px 16px;
          box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
          font-size: 0.98rem;
          color: var(--text-color);
        }

        .results-panel .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .summary-details {
            max-height: 340px;
            overflow-y: auto;
            padding-right: 8px;
        }

        .summary-details ol {
            margin: 8px 0 0 18px;
        }

        .toggle-summary-btn,
        .review-link {
            background: none;
            border: none;
            color: var(--primary-color);
            text-decoration: underline;
            cursor: pointer;
            font-weight: 800;
            padding: 0;
            font-family: inherit;
            font-size: 0.98rem;
        }

        .toggle-summary-btn {
            text-decoration: none;
            border: 1px solid var(--primary-color);
            border-radius: 6px;
            padding: 8px 12px;
        }

        @media (max-width: 700px) {
            body {
                padding: 18px 10px;
            }

            .container {
                width: 100%;
                padding: 24px 18px;
                border-radius: 16px;
            }

            h1 {
                letter-spacing: 0.12em;
                font-size: 1.35rem;
            }

            .quiz-navigation-top {
                flex-direction: column;
                align-items: stretch;
            }

            .dropdown-row {
                grid-template-columns: 1fr;
            }

            .nav-button-row {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .quiz-btn {
                min-height: 54px;
                font-size: 1rem;
            }
        }
          /* Smooth theme transition */
          html, body, .container, .question-card, .option-label, .text-answer-field,
          .quiz-select, .ordering-item, .dropdown-matching-container, .results-panel,
          .quiz-navigation-top {
            transition: background-color 420ms ease-in-out, color 420ms ease-in-out, border-color 420ms ease-in-out;
          }
          /* Dark theme overrides (applies when html[data-theme="dark"]) */
          [data-theme="dark"] {
            --page-bg: #0b0c10;
            --card-bg: #0f1720;
            --panel-bg: #0f1725;
            --text-color: #e6e7ea;
            --primary-color: #d7b6ff;
            --accent-color: #9b72ff;
            --soft-purple: #2a2430;
            --border-color: rgba(255,255,255,0.06);
            --gray-btn: #444444;
            --gray-btn-hover: #262626;
            --correct-bg: #164a2d;
            --correct-text: #b6f5c7;
            --incorrect-bg: #4a1b22;
            --incorrect-text: #ffb6c1;
          }

          .quiz-navigation-top .nav-select { width: auto; flex: 1; }

          .theme-toggle {
            margin-left: 12px;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--primary-color);
            cursor: pointer;
            font-weight: 800;
            height: 46px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
          }
    </style>
</head>
<body>

<div class="container">
    <h1>PHP Sequential Interactive Reviewer</h1>

    <div class="quiz-navigation-top">
        <label for="question-jump">Go To:</label>
      <select id="question-jump" class="nav-select" onchange="jumpToQuestion(this.value)"></select>
      <button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()" aria-pressed="false">🌙 Dark</button>
      <label class="theme-toggle" style="align-items:center; gap:6px;">
        <input type="checkbox" id="show-feedback-toggle" style="width:16px; height:16px; margin:0;" />
        <span id="show-feedback-label" style="font-weight:800;">Show Answer</span>
      </label>
    </div>

    <div id="quiz-container"></div>

    <div class="action-button-group">
        <div class="nav-button-row">
            <button class="quiz-btn nav-btn" id="prev-action-btn" onclick="navigateQuestion(-1)">← Prev</button>
            <button class="quiz-btn nav-btn" id="restart-action-btn" onclick="restartQuiz()">Restart</button>
            <button class="quiz-btn nav-btn" id="next-action-btn" onclick="navigateQuestion(1)">Next →</button>
        </div>
        <button class="quiz-btn finish-btn" id="finish-action-btn" onclick="finishQuiz()">Finish Quiz</button>
    </div>

    <div class="score-summary" id="score-box">
        Evaluated Questions: <span id="evaluated-count">0</span>/<span id="total-questions">100</span>
        <div class="results-panel" id="results-panel" style="display:none;">
            <div class="panel-header">
                <div>
                    <div id="final-score" style="font-weight: 800; font-size: 1.05rem;"></div>
                    <div id="wrong-summary-title" style="margin-top: 6px; color: #4a148c; font-weight: 800; display:none;">Incorrect questions and correct answers:</div>
                </div>
                <button class="toggle-summary-btn" id="toggle-summary-btn" onclick="toggleSummary()">Hide report</button>
            </div>
            <div id="summary-details" class="summary-details"></div>
        </div>
    </div>
</div>

<script>
const quizData = [
  {
    id: 1,
    type: "choice",
    question: "1.) A programmer accidentally created an infinite loop. Which issue MOST likely caused it?",
    options: ["A. Too many variables", "B. The condition has arithmetic operators", "C. Loop condition never becomes false", "D. Missing HTML tags"],
    answerText: "C. Loop condition never becomes false"
  },
  {
    id: 2,
    type: "text",
    question: "2.) Complete the nested function call so that it will display Inside.\n\nfunction outer(){\n  function inner(){\n  }\n  echo \"Inside\";\n  _____\n}\nouter();",
    answer: "inner();"
  },
  {
    id: 3,
    type: "choice",
    question: "3.) Analyze the code:\n\nfor ($i=1; $i<=3; $i++){\n  echo $i;\n}\n\nWhat is the output?",
    options: ["A. 012", "B. 0123", "C. 12", "D. 123"],
    answerText: "D. 123"
  },
  {
    id: 4,
    type: "choice",
    question: "4.) What is the output?\n\necho \"5\" + \"5 students\";",
    options: ["A. 10", "B. 55 students", "C. 5", "D. Error"],
    answerText: "A. 10"
  },
  {
    id: 5,
    type: "choice",
    question: "5.) A grading system must store Student Name, Subject, and Grade for hundreds of students. Which structure is MOST appropriate?",
    options: ["A. Multiple arrays", "B. A single multi-dimensional array", "C. Multiple single-dimensional array", "D. Multiple variables"],
    answerText: "B. A single multi-dimensional array"
  },
  {
    id: 6,
    type: "text",
    question: "6.) Complete the function declaration:\n\n_____ greet(){\n  echo \"Hello\";\n}",
    answer: "function"
  },
  {
    id: 7,
    type: "choice",
    question: "7.) Which software package is MOST suitable for beginners setting up PHP locally?",
    options: ["A. XAMPP", "B. Visual Studio Code", "C. Composer", "D. Git"],
    answerText: "A. XAMPP"
  },
  {
    id: 8,
    type: "text",
    question: "8.) Complete the function declaration.\n\n_____ displayMessage(){\n  echo \"Welcome\";\n}",
    answer: "function"
  },
  {
    id: 9,
    type: "choice",
    question: "9.) What will be the output?\n\n$x = 5;\nif ($x > 3){\n  if ($x < 10){\n    echo \"A\";\n  } else {\n    echo \"B\";\n  }\n}",
    options: ["A. No output", "B. A", "C. AB", "D. B"],
    answerText: "B. A"
  },
  {
    id: 10,
    type: "choice",
    question: "10.) What is the problem in this code?\n\nLine 1: $x = 5;\nLine 2:\nLine 3: function test(){\nLine 4:   echo $x;\nLine 5: }\nLine 6: test();",
    options: ["A. Missing echo in line 6", "B. Undefined variable inside function", "C. Missing return statement", "D. No problem"],
    answerText: "B. Undefined variable inside function"
  },
  {
    id: 11,
    type: "choice",
    question: "11.) What will be the output?\n\n$x = 0;\nif ($x = 1){\n  echo \"YES\";\n} else {\n  echo \"NO\";\n}",
    options: ["A. NO", "B. YES", "C. Unknown", "D. Error"],
    answerText: "B. YES"
  },
  {
    id: 12,
    type: "choice",
    question: "12.) Given:\n\n$x = 5 + 3 * 2;\n\nWhat is the value of $x?",
    options: ["A. 13", "B. 16", "C. 10", "D. 11"],
    answerText: "D. 11"
  },
  {
    id: 13,
    type: "choice",
    question: "13.) Analyze the code:\n\n$numbers = array(10,20,30);\necho count($numbers);\n\nWhat is the output?",
    options: ["A. Error", "B. No output", "C. 2", "D. 3"],
    answerText: "D. 3"
  },
  {
    id: 14,
    type: "choice",
    question: "14.) What is wrong with this code?\n\nif ($x = 5){\necho \"True\"};",
    options: ["A. No problem in the code", "B. Condition will always be true", "C. Undefined variable", "D. Syntax error"],
    answerText: "B. Condition will always be true"
  },
  {
    id: 15,
    type: "choice",
    question: "15.) A developer wants a webpage to automatically generate customized greetings for each user visiting the site. Which feature of PHP is MOST useful?",
    options: ["A. CSS animation", "B. Browser caching", "C. Static HTML rendering", "D. Server-side scripting"],
    answerText: "D. Server-side scripting"

  {
    id: 16,

    type: "choice",

    options: ["A. Fixed image gallery", "B. Offline text editor", "C. A printed brochure", "D. A webpage displaying current weather data from a database"],
    answerText: "D. A webpage displaying current weather data from a database"
  },
  {
    id: 18,
    type: "choice",
    question: "18.) PHP is embedded directly within HTML and CANNOT be placed in a separate file.",
    options: ["A. True", "B. False"],
    answerText: "B. False"
  },
  {
    id: 19,
    type: "choice",
    question: "19.) goto helps programs to be more organized and easier to maintain in the long run.",
    options: ["A. True", "B. False"],
    answerText: "B. False"
  },
  {
    id: 20,
    type: "text",
    question: "20.) Complete the loop so that it will execute 5 times:\n\nfor ($i = 1; _____; _____)",
    answer: "$i<=5; $i++"

  {
    id: 21,
    type: "choice",
    question: "21.) What is the output?\n\n$a = \"10\";\n$b = \"2a\";\necho $a + $b;",
    options: ["A. 10", "B. Error", "C. 12", "D. 102a"],
    answerText: "C. 12"
  },
  {
    id: 22,
    type: "choice",
    question: "22.) Which of the choices correctly reflects the output of the statement?\n\necho date(\"m d,Y h:i:A\");",
    options: ["A. 06 19, 2026 08:05:57 PM", "B. 6 19, 2026 8:5:57 PM", "C. Error", "D. Jun 19, 2026 08:05:57 PM"],
    answerText: "A. 06 19, 2026 08:05:57 PM"

  {
    id: 23,
    type: "text",
    question: "23.) Complete the statement so that it will return the remainder of the two parameters.\n\nfunction multiply($a, $b){\n  _____\n}",
    answer: "return $a % $b;"
  },
  {
    id: 24,
    type: "choice",
    question: "24.) Which data type is MOST appropriate for storing a student's GPA?",
    options: ["A. Integer", "B. Boolean", "C. Array", "D. Float"],
    answerText: "D. Float"

  {
    id: 25,
    type: "text",
    question: "25.) Fill in the missing operator to increase $x by 5:\n\n$x _____ 5;",
    answer: "+="

  {
    id: 26,

    answerText: "C. Infinite loop"

  {
    id: 27,
    type: "choice",

  },
  {
    id: 28,
    type: "choice",
    question: "28.) A developer accidentally declared both $Score and $score and the program did not show the output as expected. Why did the program produce unexpected results?",

    answerText: "B. PHP variables are case-sensitive"
  },
  {
    id: 29,
    type: "text",
    question: "29.) Complete the statement so that it will return the remainder of the two parameters.\n\nfunction multiply($a, $b){\n  _____\n}",
    answer: "return $a % $b;"
  },
  {
    id: 30,
    type: "text",
    question: "30.) Complete the logical operator where both conditions must be true:\n\nif ($x > 0 _____ $y > 0)",
    answer: "&&"
  },
  {
    id: 31,
    type: "choice",
    question: "31.) A student placed a PHP file on the desktop and attempted to run it directly in the browser. The PHP code appeared as plain text. What is the BEST explanation?",

    answerText: "C. PHP scripts require a web server environment and must be placed in a server-specific directory"
  },
  {
    id: 32,
    type: "choice",
    question: "32.) What is wrong with this code?\n\nfunction calc($a, $b){\n  $a + $b;\n}\necho calc(2,3);",

    answerText: "B. Missing return statement"
  },
  {
    id: 33,
    type: "text",
    question: "33.) Complete the code so that 'Access Granted' will be displayed if both conditions are true:\n\nif ($username == \"admin\" _____ $password == \"1234\"){\n  echo \"Access Granted\";\n}",
    answer: "&&"
  },
  {
    id: 34,
    type: "dropdown",
    question: "34.) Match the term to its purpose.",
    matches: [
        { term: "Browser", correct: "Displays webpages" },
        { term: "MySQL", correct: "Stores data" },
        { term: "Apache", correct: "Host websites" }
    ],
    dropdownOptions: ["Displays webpages", "Stores data", "Host websites"]
  },
  {
    id: 35,
    type: "text",
    question: "35.) Complete the function declaration:\n\n_____ displayMessage(){\n  echo \"Welcome\";\n}",
    answer: "function"
  },
  {

<script>
let currentQuizIndex = 0;
let randomizedQuizData = [];
const evaluatedQuestions = new Set();
const userAnswersState = {};
let draggedElement = null;

function shuffleCopy(array) {
    const copy = [...array];

    for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
    }

    return copy;
}

function initQuizEngine() {
    if (typeof quizData === "undefined") {
        document.getElementById("quiz-container").innerHTML =
            "<p style='color:red; font-weight:bold; padding:20px;'>Error: quizData was not loaded.</p>";
        return;
    }

    randomizedQuizData = shuffleCopy(quizData);
    currentQuizIndex = 0;

    buildQuestionJumpDropdown();

    document.getElementById("total-questions").innerText = randomizedQuizData.length;
    document.getElementById("evaluated-count").innerText = evaluatedQuestions.size;

    updateScoreBox();
    renderCurrentQuestionCard();
}

function buildQuestionJumpDropdown() {
    const jumpSelect = document.getElementById("question-jump");
    jumpSelect.innerHTML = "";

    randomizedQuizData.forEach((item, index) => {
        const opt = document.createElement("option");
        opt.value = index;
        opt.innerText = `Item ${index + 1} — Q${item.id}`;
        jumpSelect.appendChild(opt);
    });
}

function restartQuiz() {
    currentQuizIndex = 0;
    evaluatedQuestions.clear();

    Object.keys(userAnswersState).forEach(key => {
        delete userAnswersState[key];
    });

    randomizedQuizData = shuffleCopy(quizData);
    buildQuestionJumpDropdown();

    document.getElementById("evaluated-count").innerText = "0";

    const resultsPanel = document.getElementById("results-panel");
    const finalScoreEl = document.getElementById("final-score");
    const summaryDetails = document.getElementById("summary-details");
    const summaryTitle = document.getElementById("wrong-summary-title");

    if (resultsPanel) resultsPanel.style.display = "none";
    if (finalScoreEl) {
        finalScoreEl.innerText = "";
        finalScoreEl.style.display = "none";
    }
    if (summaryDetails) summaryDetails.innerHTML = "";
    if (summaryTitle) summaryTitle.style.display = "none";

    updateScoreBox();
    renderCurrentQuestionCard();
}

function getCurrentQuestion() {
    return randomizedQuizData[currentQuizIndex];
}

function getStateKey() {
    const q = getCurrentQuestion();
    return q ? String(q.id) : String(currentQuizIndex);
}

function renderCurrentQuestionCard() {
    const container = document.getElementById("quiz-container");
    container.innerHTML = "";

    const q = getCurrentQuestion();

    if (!q || typeof q.question !== "string" || typeof q.type !== "string") {
        container.innerHTML = "<div class='feedback incorrect' style='display:block;'>Error: Question data is missing or invalid.</div>";
        document.getElementById("prev-action-btn").disabled = true;
        document.getElementById("next-action-btn").disabled = true;
        document.getElementById("submit-action-btn").disabled = true;
        return;
    }

    const stateKey = getStateKey();
    const currentState = userAnswersState[stateKey];
    const alreadyChecked = currentState && currentState.checked;

    document.getElementById("question-jump").value = currentQuizIndex;

    const card = document.createElement("div");
    card.className = "question-card";
    card.id = `qcard-${currentQuizIndex}`;

    const meta = document.createElement("div");
    meta.className = "quiz-meta";
    meta.innerText = `Question Number ${q.id}`;
    card.appendChild(meta);

    const qText = document.createElement("div");
    qText.className = "question-text";
    qText.innerText = q.question;
    card.appendChild(qText);

    if (q.type === "choice") {
        renderChoiceQuestion(card, q, stateKey);
    } else if (q.type === "text") {
        renderTextQuestion(card, stateKey);
    } else if (q.type === "ordering") {
        renderOrderingQuestion(card, q, stateKey);
    } else if (q.type === "dropdown") {
        renderDropdownQuestion(card, q, stateKey);
    }

    const feedbackBlock = document.createElement("div");
    feedbackBlock.className = "feedback";
    feedbackBlock.id = `feedback-${stateKey}`;
    card.appendChild(feedbackBlock);

    container.appendChild(card);

    document.getElementById("prev-action-btn").disabled = currentQuizIndex === 0;
    const nextBtn = document.getElementById("next-action-btn");
    if (nextBtn) {
      nextBtn.disabled = currentQuizIndex === randomizedQuizData.length - 1;
      try {
        const showFeedbackStored = localStorage.getItem(SHOW_FEEDBACK_KEY);
        const showFeedback = showFeedbackStored === null ? true : showFeedbackStored === 'true';
        if (alreadyChecked) {
          nextBtn.innerText = "Next →";
        } else {
          nextBtn.innerText = showFeedback ? "Submit Answer" : "Submit & Next";
        }
      } catch (e) {
        nextBtn.innerText = alreadyChecked ? "Next →" : "Submit Answer";
      }
    }

    const submitBtn = document.getElementById("submit-action-btn");
    if (submitBtn) {
      submitBtn.disabled = !!alreadyChecked;
      submitBtn.innerText = alreadyChecked ? "Answer Submitted" : "Submit Answer";
    }

    const finishBtn = document.getElementById("finish-action-btn");
    if (finishBtn) {
        finishBtn.innerText = "Finish Quiz";
    }

    if (alreadyChecked) {
      try {
        const showFeedbackStored = localStorage.getItem(SHOW_FEEDBACK_KEY);
        const showFeedback = showFeedbackStored === null ? true : showFeedbackStored === 'true';

        if (showFeedback) {
          showFeedbackUI(
            stateKey,
            currentState.isCorrect,
            currentState.msgText
          );
        } else {
          // Ensure feedback element is hidden when the user disabled immediate feedback
          const fb = document.getElementById(`feedback-${stateKey}`);
          if (fb) fb.style.display = 'none';
        }
      } catch (e) {
        showFeedbackUI(
          stateKey,
          currentState.isCorrect,
          currentState.msgText
        );
      }
    }
}

function renderChoiceQuestion(card, q, stateKey) {
    const optionsContainer = document.createElement("div");
    optionsContainer.className = "options-container";

    q.options.forEach(opt => {
        const label = document.createElement("label");
        label.className = "option-label";

        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = `q-${stateKey}`;
        radio.value = opt;

        if (userAnswersState[stateKey] && userAnswersState[stateKey].value === opt) {
            radio.checked = true;
        }

        radio.addEventListener("change", saveCurrentInputState);

        label.appendChild(radio);
        label.appendChild(document.createTextNode(opt));
        optionsContainer.appendChild(label);
    });

    card.appendChild(optionsContainer);
}

function renderTextQuestion(card, stateKey) {
    const inputContainer = document.createElement("div");
    inputContainer.className = "text-input-container";

    const textInput = document.createElement("input");
    textInput.type = "text";
    textInput.className = "text-answer-field";
    textInput.id = `input-${stateKey}`;
    textInput.placeholder = "Type your answer here...";

    if (userAnswersState[stateKey] && userAnswersState[stateKey].value !== null) {
        textInput.value = userAnswersState[stateKey].value;
    }

    textInput.addEventListener("input", saveCurrentInputState);

    inputContainer.appendChild(textInput);
    card.appendChild(inputContainer);
}

function renderOrderingQuestion(card, q, stateKey) {
    const orderingContainer = document.createElement("div");
    orderingContainer.className = "ordering-container";

    let itemsToOrder;

    if (userAnswersState[stateKey] && Array.isArray(userAnswersState[stateKey].value)) {
        itemsToOrder = userAnswersState[stateKey].value;
    } else {
        itemsToOrder = shuffleCopy(q.items);
        userAnswersState[stateKey] = {
            checked: false,
            isCorrect: false,
            msgText: "",
            value: itemsToOrder
        };
    }

    itemsToOrder.forEach((item, idx) => {
        const orderItem = document.createElement("div");
        orderItem.className = "ordering-item";
        orderItem.id = `order-${stateKey}-${idx}`;
        orderItem.draggable = true;
        orderItem.dataset.value = item;
        orderItem.textContent = item;

        orderItem.addEventListener("dragstart", handleDragStart);
        orderItem.addEventListener("dragend", handleDragEnd);
        orderItem.addEventListener("dragover", handleDragOver);
        orderItem.addEventListener("drop", handleDrop);
        orderItem.addEventListener("dragleave", handleDragLeave);

        orderingContainer.appendChild(orderItem);
    });

    card.appendChild(orderingContainer);
}

function renderDropdownQuestion(card, q, stateKey) {
    const dropdownContainer = document.createElement("div");
    dropdownContainer.className = "dropdown-matching-container";

    q.matches.forEach((matchItem, subIdx) => {
        const row = document.createElement("div");
        row.className = "dropdown-row";

        const label = document.createElement("div");
        label.className = "dropdown-label";
        label.innerText = matchItem.term;

        const select = document.createElement("select");
        select.className = "quiz-select";
        select.id = `select-${stateKey}-${subIdx}`;

        const defaultOpt = document.createElement("option");
        defaultOpt.value = "";
        defaultOpt.innerText = "-- Choose Match --";
        select.appendChild(defaultOpt);

        q.dropdownOptions.forEach(optVal => {
            const option = document.createElement("option");
            option.value = optVal;
            option.innerText = optVal;
            select.appendChild(option);
        });

        if (
            userAnswersState[stateKey] &&
            Array.isArray(userAnswersState[stateKey].value) &&
            userAnswersState[stateKey].value[subIdx]
        ) {
            select.value = userAnswersState[stateKey].value[subIdx];
        }

        select.addEventListener("change", saveCurrentInputState);

        row.appendChild(label);
        row.appendChild(select);
        dropdownContainer.appendChild(row);
    });

    card.appendChild(dropdownContainer);
}

function navigateQuestion(step) {
  const nextTarget = currentQuizIndex + step;

  if (nextTarget < 0 || nextTarget >= randomizedQuizData.length) {
    return;
  }

  // If moving forward and current question not yet checked, treat Next as Submit
  if (step > 0) {
    const stateKey = getStateKey();
    const currentState = userAnswersState[stateKey];

    if (!currentState || !currentState.checked) {
      // First Next: depending on preference either show feedback and stay,
      // or silently evaluate and immediately advance.
      triggerVerification(true);

      try {
        const showFeedbackStored = localStorage.getItem(SHOW_FEEDBACK_KEY);
        const showFeedback = showFeedbackStored === null ? true : showFeedbackStored === 'true';
        if (!showFeedback) {
          // Silently advance to next question
          setTimeout(() => {
            currentQuizIndex = nextTarget;
            renderCurrentQuestionCard();
          }, 120);
        }
      } catch (e) {
        // ignore and keep current behavior (stay on question)
      }

      return;
    }
  }

  saveCurrentInputState();
  currentQuizIndex = nextTarget;
  renderCurrentQuestionCard();
}

function jumpToQuestion(indexVal) {
    const parsedIdx = parseInt(indexVal, 10);

    if (!Number.isNaN(parsedIdx) && parsedIdx >= 0 && parsedIdx < randomizedQuizData.length) {
        saveCurrentInputState();
        currentQuizIndex = parsedIdx;
        renderCurrentQuestionCard();
    }
}

function saveCurrentInputState() {
    const q = getCurrentQuestion();
    if (!q) return;

    const stateKey = getStateKey();

    if (!userAnswersState[stateKey]) {
        userAnswersState[stateKey] = {
            checked: false,
            isCorrect: false,
            msgText: "",
            value: null
        };
    }

    if (userAnswersState[stateKey].checked) return;

    if (q.type === "choice") {
        const checkedInput = document.querySelector(`input[name="q-${stateKey}"]:checked`);
        userAnswersState[stateKey].value = checkedInput ? checkedInput.value : null;
    } else if (q.type === "text") {
        const textIn = document.getElementById(`input-${stateKey}`);
        userAnswersState[stateKey].value = textIn ? textIn.value.trim() : "";
    } else if (q.type === "ordering") {
        const orderingItems = document.querySelectorAll(".ordering-item");
        userAnswersState[stateKey].value = Array.from(orderingItems).map(item => item.dataset.value);
    } else if (q.type === "dropdown") {
        const selections = [];
        q.matches.forEach((_, subIdx) => {
            const selectEl = document.getElementById(`select-${stateKey}-${subIdx}`);
            selections.push(selectEl ? selectEl.value : "");
        });
        userAnswersState[stateKey].value = selections;
    }
}

function triggerVerification(force = false) {
  const q = getCurrentQuestion();
  if (!q) return;

  const stateKey = getStateKey();

  if (userAnswersState[stateKey] && userAnswersState[stateKey].checked) {
    return;
  }

  saveCurrentInputState();

  let isCorrect = false;
  let feedbackText = "";

  if (q.type === "choice") {
    const userValue = userAnswersState[stateKey]?.value;

    if (!userValue) {
      if (!force) {
        alert("Please select an option first.");
        return;
      } else {
        isCorrect = false;
        feedbackText = `Incorrect.\nCorrect Answer: ${q.answerText}`;
      }
    } else {
      isCorrect = userValue === q.answerText;
      feedbackText = isCorrect ? "Correct!" : `Incorrect.\nCorrect Answer: ${q.answerText}`;
    }
  } else if (q.type === "text") {
    const userValue = userAnswersState[stateKey]?.value || "";

    if (userValue.trim() === "") {
      if (!force) {
        alert("Please type your answer first.");
        return;
      } else {
        isCorrect = false;
        feedbackText = `Incorrect.\nCorrect Answer: ${q.answer}`;
      }
    } else {
      isCorrect = normalizeTextAnswer(userValue) === normalizeTextAnswer(q.answer);
      feedbackText = isCorrect ? "Correct!" : `Incorrect.\nCorrect Answer: ${q.answer}`;
    }
  } else if (q.type === "ordering") {
    const currentOrder = userAnswersState[stateKey]?.value || [];

    isCorrect = JSON.stringify(currentOrder) === JSON.stringify(q.correctOrder);
    feedbackText = isCorrect
      ? "Correct! Perfect order."
      : `Incorrect order.\nCorrect order:\n• ${q.correctOrder.join("\n• ")}`;
  } else if (q.type === "dropdown") {
    const selections = userAnswersState[stateKey]?.value || [];

    if (selections.some(item => item === "") || selections.length !== q.matches.length) {
      if (!force) {
        alert("Please complete all dropdown matches first.");
        return;
      } else {
        const answerGuide = q.matches.map(match => `${match.term} -> ${match.correct}`);
        isCorrect = false;
        feedbackText = `Incorrect matching.\n\nCorrect Matches:\n• ${answerGuide.join("\n• ")}`;
      }
    } else {
      const answerGuide = q.matches.map(match => `${match.term} -> ${match.correct}`);
      isCorrect = q.matches.every((match, idx) => selections[idx] === match.correct);
      feedbackText = isCorrect
        ? "Correct! All pairs matched perfectly."
        : `Incorrect matching.\n\nCorrect Matches:\n• ${answerGuide.join("\n• ")}`;
    }
  }

  userAnswersState[stateKey] = {
    ...userAnswersState[stateKey],
    checked: true,
    isCorrect: isCorrect,
    msgText: feedbackText
  };

  evaluatedQuestions.add(stateKey);
  const evaluatedEl = document.getElementById("evaluated-count");
  if (evaluatedEl) evaluatedEl.innerText = evaluatedQuestions.size;

  // Only show immediate feedback if user enabled it
  try {
    const showFeedbackStored = localStorage.getItem(SHOW_FEEDBACK_KEY);
    const showFeedback = showFeedbackStored === null ? true : showFeedbackStored === 'true';
    if (showFeedback) {
      showFeedbackUI(stateKey, isCorrect, feedbackText);
    } else {
      // hide feedback UI if present
      const el = document.getElementById(`feedback-${stateKey}`);
      if (el) el.style.display = 'none';
    }
  } catch (e) {
    showFeedbackUI(stateKey, isCorrect, feedbackText);
  }
  updateScoreBox();
  renderCurrentQuestionCard();
}

function calculateScore() {
    return Object.values(userAnswersState).filter(entry => entry && entry.checked && entry.isCorrect).length;
}

function normalizeTextAnswer(text) {
    return String(text || "")
        .toLowerCase()
        .replace(/\s+/g, "")
        .replace(/[“”]/g, '"')
        .replace(/[‘’]/g, "'")
        .replace(/;$/, "");
}

function escapeHtml(text) {
    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
}

function getCorrectAnswerText(q) {
    if (!q) return "";

    if (q.type === "choice") return q.answerText;
    if (q.type === "text") return q.answer;
    if (q.type === "ordering") return q.correctOrder.join(" → ");
    if (q.type === "dropdown") return q.matches.map(match => `${match.term}: ${match.correct}`).join("; ");

    return "";
}

function updateScoreBox() {
    const evaluatedCount = evaluatedQuestions.size;
    const total = randomizedQuizData.length || quizData.length;

    document.getElementById("evaluated-count").innerText = evaluatedCount;
    document.getElementById("total-questions").innerText = total;

    const finalScoreEl = document.getElementById("final-score");
    const summaryDetails = document.getElementById("summary-details");
    const summaryTitle = document.getElementById("wrong-summary-title");
    const resultsPanel = document.getElementById("results-panel");

    if (!finalScoreEl || !summaryDetails || !summaryTitle || !resultsPanel) return;

    if (evaluatedCount === total && total > 0) {
        const correct = calculateScore();
        const percent = Math.round((correct / total) * 100);

        finalScoreEl.innerText = `Final Score: ${correct}/${total} (${percent}%)`;
        finalScoreEl.style.display = "block";

        const wrongEntries = randomizedQuizData
            .map((q, index) => ({ q, index, entry: userAnswersState[String(q.id)] }))
            .filter(item => item.entry && item.entry.checked && !item.entry.isCorrect)
            .map(item => {
                const correctAnswer = getCorrectAnswerText(item.q);
                return `<li><button type="button" class="review-link" data-index="${item.index}">Item ${item.index + 1} — Q${item.q.id}</button>: ${escapeHtml(correctAnswer)}</li>`;
            });

        if (wrongEntries.length === 0) {
            summaryDetails.innerHTML = "<strong>Well done! You answered all questions correctly.</strong>";
            summaryTitle.style.display = "none";
        } else {
            summaryTitle.style.display = "block";
            summaryDetails.innerHTML = `<ol>${wrongEntries.join("")}</ol>`;
        }

        resultsPanel.style.display = "block";
        summaryDetails.style.display = "block";
    } else {
        finalScoreEl.style.display = "none";
        finalScoreEl.innerText = "";
        resultsPanel.style.display = "none";
        summaryDetails.innerHTML = "";
        summaryTitle.style.display = "none";
    }
}

function toggleSummary() {
    const summaryDetails = document.getElementById("summary-details");
    const toggleButton = document.getElementById("toggle-summary-btn");

    if (!summaryDetails || !toggleButton) return;

    if (summaryDetails.style.display === "none" || summaryDetails.style.display === "") {
        summaryDetails.style.display = "block";
        toggleButton.innerText = "Hide report";
    } else {
        summaryDetails.style.display = "none";
        toggleButton.innerText = "Show report";
    }
}

document.body.addEventListener("click", function(e) {
    if (e.target.matches(".review-link")) {
        const index = Number(e.target.dataset.index);

        if (!Number.isNaN(index)) {
            jumpToQuestion(index);
        }
    }
});

function showFeedbackUI(stateKey, isCorrect, textMessage) {
    const el = document.getElementById(`feedback-${stateKey}`);
    if (!el) return;

    el.style.display = "block";
    el.className = isCorrect ? "feedback correct" : "feedback incorrect";
    el.innerText = textMessage;
}

function handleDragStart(e) {
    draggedElement = this;
    this.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
}

function handleDragEnd() {
    this.classList.remove("dragging");
    document.querySelectorAll(".ordering-item").forEach(item => item.classList.remove("drag-over"));
    saveCurrentInputState();
}

function handleDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";

    if (this !== draggedElement) {
        this.classList.add("drag-over");
    }

    return false;
}

function handleDragLeave() {
    this.classList.remove("drag-over");
}

function handleDrop(e) {
    e.stopPropagation();

    if (draggedElement !== this) {
        const allItems = Array.from(this.parentNode.children);
        const draggedIndex = allItems.indexOf(draggedElement);
        const targetIndex = allItems.indexOf(this);

        if (draggedIndex < targetIndex) {
            this.parentNode.insertBefore(draggedElement, this.nextSibling);
        } else {
            this.parentNode.insertBefore(draggedElement, this);
        }
    }

    this.classList.remove("drag-over");
    saveCurrentInputState();
    return false;
}

function finishQuiz() {
    saveCurrentInputState();

    const total = randomizedQuizData.length;
    const submittedCount = evaluatedQuestions.size;
    const remaining = total - submittedCount;

    let message = "Are you sure you want to finish the quiz?";

    if (remaining > 0) {
        message = `You still have ${remaining} unsubmitted question(s). They will be counted as incorrect. Finish quiz?`;
    }

    const confirmFinish = confirm(message);

    if (!confirmFinish) {
        return;
    }

    randomizedQuizData.forEach(q => {
        const key = String(q.id);

        if (!userAnswersState[key]) {
            userAnswersState[key] = {
                checked: true,
                isCorrect: false,
                msgText: `No answer submitted.\nCorrect Answer: ${getCorrectAnswerText(q)}`,
                value: null
            };
        }

        if (!userAnswersState[key].checked) {
            userAnswersState[key].checked = true;
            userAnswersState[key].isCorrect = false;
            userAnswersState[key].msgText = `Not submitted.\nCorrect Answer: ${getCorrectAnswerText(q)}`;
        }

        evaluatedQuestions.add(key);
    });

    document.getElementById("evaluated-count").innerText = evaluatedQuestions.size;

    updateScoreBox();
    renderCurrentQuestionCard();

    const resultsPanel = document.getElementById("results-panel");
    if (resultsPanel) {
        resultsPanel.scrollIntoView({ behavior: "smooth", block: "start" });
    }
}

window.onload = initQuizEngine;
</script>

window.onload = initQuizEngine;

<script>
// Theme handling: persist preference in localStorage and apply via html[data-theme]
const THEME_KEY = 'site-theme';
const SHOW_FEEDBACK_KEY = 'show-feedback';

function applyTheme(theme) {
  try {
    if (theme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
    updateThemeToggleUI(theme);
  } catch (e) {
    console.warn('Theme apply failed', e);
  }
}

function updateThemeToggleUI(theme) {
  const btn = document.getElementById('theme-toggle');
  if (!btn) return;
  if (theme === 'dark') {
    btn.innerText = '☀️ Light';
    btn.setAttribute('aria-pressed', 'true');
  } else {
    btn.innerText = '🌙 Dark';
    btn.setAttribute('aria-pressed', 'false');
  }
}

function toggleTheme() {
  const current = localStorage.getItem(THEME_KEY) === 'dark' ? 'dark' : 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  localStorage.setItem(THEME_KEY, next === 'dark' ? 'dark' : 'light');
  applyTheme(next);
}

function initThemeFromStorage() {
  const stored = localStorage.getItem(THEME_KEY);
  const theme = stored === 'dark' ? 'dark' : 'light';
  applyTheme(theme);
}

// Initialize theme as soon as possible
initThemeFromStorage();
// Initialize show-feedback toggle
function initShowFeedbackFromStorage() {
  const stored = localStorage.getItem(SHOW_FEEDBACK_KEY);
  const enabled = stored === null ? true : stored === 'true';
  const chk = document.getElementById('show-feedback-toggle');
  if (chk) chk.checked = enabled;
}

function setShowFeedback(value) {
  try {
    localStorage.setItem(SHOW_FEEDBACK_KEY, value ? 'true' : 'false');
    const chk = document.getElementById('show-feedback-toggle');
    if (chk) chk.checked = !!value;
  } catch (e) {
    console.warn('Could not save show-feedback', e);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  initShowFeedbackFromStorage();
  const chk = document.getElementById('show-feedback-toggle');
  if (chk) {
    chk.addEventListener('change', (e) => setShowFeedback(e.target.checked));
  }
});
</script>
